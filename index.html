<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติส่วนตัว</title>
  <style>
    .rainbow {
      background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-size: 40px;
    }
  </style>
</head>
<body>
  <h1 class="rainbow">ประวัติส่วนตัว</h1>
  <p class="rainbow">ชื่อ น.ส.กรองเเก้ว ม่วงสุราช เลขที่14 ชั้น ม.6/3</p>
  <p class="rainbow">ชื่อ น.ส.นภาวดี นิ่มเปีย เลขที่15 ชั้น ม.6/3</p>
</body>
</html>
